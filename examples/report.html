<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'"><title>SkillParcel · Native transmission report</title><style>:root {
  --paper: #fbfaf7;
  --ink: #222b2b;
  --muted: #5c6867;
  --line: #c8ceca;
  --accent: #165e55;
  --warn: #8a432c;
  --error: #922d39;
  --code: #eeefea;
  --add: #e1efe7;
  --remove: #fae6e1;
  --white: #fff;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font:
    15px/1.6 Georgia,
    serif;
}
main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 44px 42px;
}
header {
  padding: 0 0 30px;
  border-bottom: 3px solid var(--ink);
}
h1 {
  font-size: clamp(30px, 4vw, 50px);
  line-height: 1.16;
  letter-spacing: -1px;
  font-weight: 400;
  margin: 8px 0 18px;
}
h2 {
  font-size: 24px;
  font-weight: 400;
  line-height: 1.3;
  margin: 0 0 14px;
}
h3 {
  font-size: 19px;
  font-weight: 400;
  margin: 0 0 10px;
}
.eyebrow,
.rail,
table,
select,
button,
input,
.meta,
.status,
summary,
#summary,
#coverage,
#recorded {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--accent);
  margin: 0;
}
.rail {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 25px;
  color: var(--muted);
}
.rail span {
  color: var(--accent);
}
#coverage {
  margin: 0;
  font-size: 13px;
}
#recorded {
  color: var(--muted);
  font-size: 12px;
  margin: 10px 0 0;
}
section {
  padding: 26px 0;
  border-bottom: 1px solid var(--line);
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.section-head h2 {
  margin: 0;
}
label {
  font-size: 13px;
}
select {
  margin-left: 10px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--paper);
  color: var(--ink);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
  border-bottom: 1px solid var(--ink);
  padding: 10px 12px;
}
td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
td:first-child {
  width: 48%;
}
td button {
  font-size: 13px;
  text-align: left;
  border: 0;
  padding: 0;
  background: none;
  color: var(--ink);
  overflow-wrap: anywhere;
  cursor: pointer;
}
tr[aria-selected="true"] {
  background: var(--code);
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  padding: 8px 12px;
  background: var(--paper);
  color: var(--accent);
}
button:hover {
  color: var(--ink);
  border-color: var(--accent);
}
:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.status {
  font-size: 12px;
  font-weight: 600;
}
.status.pass {
  color: var(--accent);
}
.status.violation {
  color: var(--warn);
}
.status.error {
  color: var(--error);
}
.status.unsupported,
.status.cancelled {
  color: var(--muted);
}
.meta {
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.check {
  margin-top: 26px;
}
.panes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  min-width: 0;
}
.panes > div {
  min-width: 0;
}
pre {
  background: var(--code);
  border-left: 2px solid var(--line);
  padding: 16px;
  margin: 6px 0 16px;
  overflow-x: auto;
  max-width: 100%;
  font:
    12px/1.65 ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  white-space: pre;
  tab-size: 4;
}
.diff {
  border-color: var(--accent);
}
.diff span {
  display: block;
  white-space: pre;
}
.diff .added {
  background: var(--add);
}
.diff .removed {
  background: var(--remove);
}
.table-scroll {
  overflow-x: auto;
}
details {
  margin: 20px 0;
}
summary {
  cursor: pointer;
  font-size: 12px;
  padding: 8px 0;
}
.evidence {
  font-size: 12px;
  padding-left: 22px;
  overflow-wrap: anywhere;
}
.evidence li {
  padding: 3px 0;
}
.reason {
  border-left: 3px solid var(--warn);
  padding-left: 14px;
  overflow-wrap: anywhere;
}
footer {
  padding-top: 30px;
  color: var(--muted);
  font-size: 13px;
}
footer h2 {
  color: var(--ink);
}
input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid var(--line);
  background: var(--white);
}
.fallback {
  display: block;
  margin-top: 12px;
}
[hidden] {
  display: none !important;
}
#summary {
  font-size: 11px;
  color: var(--muted);
}
@media (max-width: 700px) {
  main {
    padding: 24px 18px;
  }
  .section-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }
  .panes {
    grid-template-columns: 1fr;
    gap: 0;
  }
  td,
  th {
    padding: 9px 6px;
  }
  td:first-child {
    width: 44%;
  }
  table {
    font-size: 10px;
  }
  td button {
    font-size: 11px;
  }
  .rail {
    font-size: 9px;
    gap: 8px;
  }
  h2 {
    font-size: 22px;
  }
  pre {
    font-size: 11px;
  }
  header {
    padding-bottom: 24px;
  }
  .section-head label {
    width: 100%;
  }
  .section-head select {
    float: right;
  }
}
@media print {
  #copy,
  .section-head label {
    display: none;
  }
  main {
    padding: 0;
  }
  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
}

  const report = JSON.parse(document.getElementById("report-data").textContent);
  const byId = (id) => document.getElementById(id);
  const node = (tag, text, className) => {
    const n = document.createElement(tag);
    if (text !== undefined)
      n.textContent = typeof text === "string" ? visible(text) : text;
    if (className) n.className = className;
    return n;
  };
  // Display escapes are separate from the original measured strings.
  const visible = (s) =>
    Array.from(s, (c) => {
      const code = c.codePointAt(0);
      if (code === 13) return "␍";
      if (
        (code < 32 && code !== 9 && code !== 10) ||
        (code >= 127 && code <= 159) ||
        (code >= 0x202a && code <= 0x202e) ||
        (code >= 0x2066 && code <= 0x2069) ||
        code === 0x200e ||
        code === 0x200f
      )
        return "\\u" + code.toString(16).padStart(4, "0");
      return c;
    }).join("");
  byId("coverage").textContent =
    `Claude Code ${report.nativeVersion} · ${report.OS}/${report.arch} · ${report.coverage}`;
  byId("recorded").textContent =
    (report.recorded
      ? "RECORDED synthetic captured run; this does not verify this machine. "
      : "Synthetic captured run. ") + report.recordedAt;
  byId("network").textContent = report.networkMode;
  byId("versions").textContent =
    `SkillParcel ${report.toolVersion} · adapter ${report.adapterVersion}` +
    (report.sourceCommit
      ? ` · source ${report.sourceCommit}`
      : " · source commit not supplied");
  for (const omission of report.omissions)
    byId("omissions").append(node("li", omission));
  let selected = -1;
  function detail(index) {
    selected = index;
    const c = report.cases[index],
      host = byId("detail");
    host.replaceChildren();
    host.append(node("h2", c.title));
    host.firstChild.id = "case-heading";
    host.append(
      node(
        "p",
        `${c.outcome.toUpperCase()} · measurement ${c.measurementStatus} · contract ${c.contractStatus}`,
        "status " + c.outcome,
      ),
    );
    if (c.reason)
      host.append(
        node(
          "p",
          `${c.reasonCode}: ${c.reason}. Review the fixture or adapter support before rerunning.`,
          "reason",
        ),
      );
    host.append(
      node("p", `Fixture SHA-256 ${c.fixtureHash || "unavailable"}`, "meta"),
    );
    for (const check of c.checks) {
      const article = node("article", undefined, "check");
      article.append(node("h3", check.id));
      article.append(
        node(
          "p",
          `${check.stage} · ${check.sourceFile} · bytes ${check.sourceRange.startByte}–${check.sourceRange.endByte} · UTF-8`,
          "meta",
        ),
      );
      article.append(
        node(
          "p",
          `${check.mode} · normalization ${check.normalization} · raw ${check.rawPass === null ? "unmeasured" : check.rawPass ? "pass" : "different"} · verdict ${check.pass === null ? "unmeasured" : check.pass ? "pass" : "violation"}`,
          "meta",
        ),
      );
      const panes = node("div", undefined, "panes");
      for (const [label, text] of [
        ["Source bytes (decoded)", check.source],
        ["Transmitted API fragment", check.transmitted ?? "Stage not measured"],
      ]) {
        const pane = node("div");
        pane.append(node("h3", label), node("pre", visible(text)));
        panes.append(pane);
      }
      article.append(panes);
      const gold = node("details");
      gold.append(
        node("summary", "Author contract / expected text"),
        node("pre", visible(check.expected)),
      );
      article.append(gold);
      if (check.diff.length) {
        article.append(node("h3", "Expected → transmitted diff"));
        const pre = node("pre", undefined, "diff");
        for (const diff of check.diff)
          pre.append(
            node(
              "span",
              (diff.kind === "added"

                : diff.kind === "removed"
                  ? "- "
                  : "  ") + visible(diff.text),
              diff.kind,
            ),
          );
        article.append(pre);
      }
      if (check.evidenceRef)
        article.append(
          node(
            "p",
            `request #${check.evidenceRef.requestOrdinal} · user message ${check.evidenceRef.messageIndex}, block ${check.evidenceRef.blockIndex}` +
              (check.evidenceRef.toolUseId
                ? ` · ${check.evidenceRef.toolUseId}`
                : ""),
            "meta",
          ),
        );
      host.append(article);
    }
    const evidence = node("details");
    evidence.append(
      node("summary", "Stage evidence (" + c.evidence.length + " events)"),
    );
    const list = node("ol", undefined, "evidence");
    for (const e of c.evidence)
      list.append(
        node(
          "li",
          `+${e.elapsedMs} ms · ${e.stage}` +
            (e.requestOrdinal ? ` · request #${e.requestOrdinal}` : "") +
            (e.toolUseId ? ` · ${e.toolUseId}` : "") +
            (e.detail ? ` · ${e.detail}` : ""),
        ),
      );
    evidence.append(list);
    host.append(evidence);
    for (const omitted of c.omissions) host.append(node("p", omitted, "meta"));
    renderRows();
  }
  function renderRows() {
    const filter = byId("filter").value;
    const tbody = byId("cases");
    tbody.replaceChildren();
    let shown = 0;
    report.cases.forEach((c, index) => {
      if (filter !== "all" && c.outcome !== filter) return;
      shown++;
      const tr = node("tr");
      tr.setAttribute("aria-selected", String(index === selected));
      const title = node("td");
      const button = node("button", c.title);
      button.type = "button";
      button.setAttribute("aria-label", "Select case " + c.id);
      button.addEventListener("click", () => {
        detail(index);
        byId("case-heading").setAttribute("tabindex", "-1");
        byId("case-heading").focus();
      });
      title.append(button, node("div", c.id, "meta"));
      tr.append(
        title,
        node("td", c.outcome, "status " + c.outcome),
        node("td", c.observedStages.join(" + ") || "unmeasured"),
        node(
          "td",
          `${c.checks.filter((x) => x.pass !== null).length}/${c.checks.length}`,
        ),
      );
      tbody.append(tr);
    });
    byId("empty").hidden = shown !== 0;
    byId("summary").textContent =
      `${shown} visible / ${report.cases.length} cases · exit ${report.exitCode} · controls are escaped for display; text comparison used the original characters`;
  }
  byId("filter").addEventListener("change", () => {
    const index = report.cases.findIndex(
      (c) =>
        byId("filter").value === "all" || c.outcome === byId("filter").value,
    );
    if (index >= 0) detail(index);
    else {
      selected = -1;
      byId("detail").replaceChildren(node("p", "No measured case selected."));
      renderRows();
    }
  });
  byId("copy").addEventListener("click", async () => {
    const text = byId("command").value;
    try {
      await navigator.clipboard.writeText(text);
      byId("copy-status").textContent = "Command copied.";
    } catch {
      document.querySelector(".fallback").hidden = false;
      byId("command").focus();
      byId("command").select();
      byId("copy-status").textContent = "Select and copy the command above.";
    }
  });
  if (report.cases.length)
    detail(
      Math.max(
        0,
        report.cases.findIndex((c) => c.outcome === "violation"),
      ),
    );
  else {
    byId("detail").append(
      node("p", "No cases were measured. This report cannot pass."),
    );
    renderRows();
  }
})();
</script></body></html>
